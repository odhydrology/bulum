[tox]
# Test across all supported Python versions
env_list = py311,py312,py313,py314

# Minimum tox version
minversion = 4.0

[testenv]
# Install package in editable mode to avoid import path conflicts
package = editable

# Dependencies needed for testing
deps =
    pytest>=8.0.0

# Commands to run
commands =
    pytest {posargs}

# Pass through these environment variables (useful for CI)
passenv =
    HOME
    USER

[testenv:py311]
description = Run tests with Python 3.11

[testenv:py312]
description = Run tests with Python 3.12

[testenv:py313]
description = Run tests with Python 3.13

[testenv:py314]
description = Run tests with Python 3.14

# Optional: Quick test environment (runs faster by skipping install)
[testenv:quick]
description = Quick test run with current Python
skip_install = true
commands =
    pytest tests/ {posargs}

# Optional: Coverage environment
# tox -e coverage
[testenv:coverage]
description = Run tests with coverage reporting
deps =
    pytest>=8.0.0
    pytest-cov
commands =
    pytest --cov=bulum --cov-report=html --cov-report=term {posargs}
